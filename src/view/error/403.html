<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>403 - 禁止访问</title>
    <!-- 禁止索引 -->
    <meta name="robots" content="noindex">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F0F0F0;
        }

        .container {
            text-align: center;
            color: #333333;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            animation: fadeInDown 2s ease-in-out;
        }

        p {
            font-size: 1.5rem;
            margin: 20px 0;
            animation: fadeInUp 2s ease-in-out 1s;
        }

        a {
            text-decoration: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            color: #FFFFFF;
            background-color: #198754; /* 绿色 */
            border-radius: 5px;
            transition: background-color 0.3s;
            animation: fadeInUp 2s ease-in-out 1.5s;
        }

        a:hover {
            background-color: #157347;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            font-size: 7rem;
            margin-bottom: 20px;
            color: #198754;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="error-icon">🚫</div>
    <h1>403</h1>
    <p>对不起，您没有权限访问此页面。</p>
    <a href="/">返回首页</a>
</div>

</body>
</html>
