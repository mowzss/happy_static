{extend name="../table" /} {block name="content"} {notempty name="$search_code"}<div class="layui-card"><div class="layui-card-body"> {$search_code|raw}</div></div> {/notempty}<div class="layui-tab layui-tab-card layui-card"><ul class="layui-tab-title" id="module_content_list"> {foreach $dirs as $key=>$name } {if $request->param('dir','pc')== $key }<li lay-ajax="{:urls('index',['dir'=>$key])}" class="layui-this">{$name}</li> {else/}<li lay-ajax="{:urls('index',['dir'=>$key])}">{$name}</li> {/if} {/foreach}</ul><div class="layui-card-body"><table class="layui-hide page-Table" id="{:get_lay_table_id()}" lay-filter="{:get_lay_table_id()}" data-url="{:urls('index')}"></table></div></div><script type="text/html" id="{:get_lay_table_id()}ToolbarTop">
    <div class="layui-btn-container">
        {$top_button|default=""|raw}
    </div>
</script><script type="text/html" id="{:get_lay_table_id()}Tool">
    {$right_button|default=""|raw}
</script> {/block} {block name="js"}<script type="application/json" id="happy-table-config">{:json_encode(['is_page' => $is_page ?? true, 'default_order' => $default_order ?? ['id' => 'desc'], 'where' => $where ?? [], 'cols' => $tables['fields'] ?? [], 'is_tree' => $is_tree ?? false])}</script><script>
    layui.use(['layTable', 'jquery'], function () {
        let layTable = layui.layTable,
            $ = layui.jquery,
            config = {},
            configElem = document.getElementById('happy-table-config');
        try {
            config = JSON.parse(configElem.textContent);
        } catch (e) {
            console.error('表格配置解析失败', e);
        }
        let opt = {
                elem: '#{:get_lay_table_id()}',
                headers: {out: 'json'},
                cols: [config.cols || []],
                dataUrls: {
                    add: "{:urls('add',['dir'=>$request->param('dir','pc')])}",
                    edit: "{:urls('edit',['dir'=>$request->param('dir','pc')])}",
                    del: "{:urls('delete')}",
                    quick: "{:urls('quickEdit')}",
                },
                isTree: config.is_tree,
            }
        // 初始化 opt.where 为一个空对象，以防后续需要添加内容
        opt.where = {};
        // 如果 where 不为空，则将其内容合并到 opt.where 中
        if (config.where && Object.keys(config.where).length > 0) {
            Object.assign(opt.where, config.where);
        }
        // 获取 order 对象的所有键并设置排序条件
        Object.keys(config.default_order || {}).forEach(key => {
            if (config.default_order[key]) {
                // 合并排序条件到 where 中
                Object.assign(opt.where, {
                    _order: key,
                    _by: config.default_order[key]
                });
            }
        });
        if (opt.isTree) {
            opt.tree = {
                customName: {
                    name: 'title',
                    pid: 'pid'
                }
            }
        }
        opt.page = config.is_page;
        // 渲染表格
        layTable.render(opt);

        // 使用事件委托，页面内容被替换后仍能响应
        $(document).off('click.happyTabAjax', '#module_content_list [lay-ajax]')
            .on('click.happyTabAjax', '#module_content_list [lay-ajax]', function () {
                var $this = $(this);
                $.ajax({
                    url: $this.attr('lay-ajax'),
                    type: 'post',
                    success: function (res) {
                        $this.closest('.happy-tab-content').html(res);
                    }
                })
            })
    });
</script> {/block}
